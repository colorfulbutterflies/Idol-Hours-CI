name: Validate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA in colorfulbutterflies/Idol-Hours to validate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.inputs.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private repo at the requested SHA
        uses: actions/checkout@v4
        with:
          repository: colorfulbutterflies/Idol-Hours
          ref: ${{ inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: idol-hours
          fetch-depth: 0
          filter: blob:none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: idol-hours/app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: idol-hours/app
        run: pnpm install --frozen-lockfile

      - name: Validate (typecheck, arch, tests, build, skills lint)
        working-directory: idol-hours/app
        run: pnpm run validate:pr

      - name: Summary
        if: always()
        run: |
          echo "### Validate ${{ inputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: \`${{ inputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
