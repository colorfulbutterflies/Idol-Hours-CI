name: E2E

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA in colorfulbutterflies/Idol-Hours to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.inputs.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private repo (full history + LFS)
        uses: actions/checkout@v4
        with:
          repository: colorfulbutterflies/Idol-Hours
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          lfs: true
          path: idol-hours

      - name: Checkout requested SHA
        run: |
          set -euo pipefail
          SHA="${{ inputs.sha }}"
          echo "Checking out $SHA"
          git -C idol-hours checkout "$SHA"
          git -C idol-hours rev-parse HEAD

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: idol-hours/app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: idol-hours/app
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: idol-hours/app
        run: pnpm run build

      - name: Install Playwright (chromium)
        working-directory: idol-hours/app
        run: pnpm exec playwright install --with-deps chromium

      - name: Critical-journey E2E
        working-directory: idol-hours/app
        run: |
          pnpm exec vite preview --port 5173 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:5173 --timeout 60000
          pnpm exec playwright test --project=chromium

      - name: Summary
        if: always()
        run: |
          echo "### E2E ${{ inputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: \`${{ inputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
